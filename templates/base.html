<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Проект{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Главная</a> | 
        <a href="{% url 'employee_list' %}">Сотрудники</a> |
        {% if user.is_authenticated %}
            Вы вошли как {{ user.username }} | <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
        {% endif %}
    </nav>
    <hr>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
